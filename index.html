<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- GitHub Pages ignores _headers, so the referrer rule also lives here. Origin only:
       OpenStreetMap blocks tile requests from web pages that send no Referer at all. -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Rastreamento Ruffino</title>
  <link rel="icon" type="image/svg+xml" href="logo-ruffino.svg">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css?v=c164814">
</head>
<body>
  <section id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <img class="login-logo" src="logo-ruffino.svg" alt="Ruffino Acabamentos">
      <h1>Portal de Rastreamento</h1>
      <p class="muted">Acesso restrito à diretoria.</p>
      <button id="login-microsoft" type="button">Entrar com Microsoft</button>
      <div id="password-login" class="password-login" hidden>
        <p class="muted small">Acesso de teste (somente ambiente local)</p>
        <label>E-mail <input id="login-email" type="email" autocomplete="username"></label>
        <label>Senha <input id="login-password" type="password" autocomplete="current-password"></label>
        <button type="submit" class="secondary">Entrar com senha</button>
      </div>
      <p id="login-error" class="error" role="alert" hidden></p>
    </form>
  </section>

  <section id="app" class="app" hidden>
    <header class="topbar">
      <span class="brand">
        <img class="brand-logo" src="logo-ruffino.svg" alt="Ruffino Acabamentos">
        <strong>Portal de Rastreamento</strong>
      </span>
      <span class="topbar-right">
        <span id="collector-status" class="collector-status" role="status"></span>
        <span id="user-email" class="muted"></span>
        <button id="logout" class="link-button" type="button">Sair</button>
      </span>
    </header>

    <aside class="sidebar">
      <div class="sidebar-head">
        <h2>Aparelhos</h2>
        <button id="show-all" class="link-button" type="button">Ver todos no mapa</button>
      </div>
      <ul class="legend" aria-label="Legenda das cores">
        <li><span class="dot fresh"></span>Posição de até 30 min</li>
        <li><span class="dot stale"></span>Até 24 h</li>
        <li><span class="dot old"></span>Mais antiga</li>
      </ul>
      <p id="devices-status" class="muted" role="status">Carregando…</p>
      <ul id="device-list" class="device-list"></ul>
    </aside>

    <main class="main">
      <div id="toolbar" class="toolbar" hidden>
        <strong id="selected-name"></strong>
        <span class="day-picker">
          <button id="day-prev" type="button" class="step-button" aria-label="Período anterior">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>
          </button>
          <label class="range-field">De <input id="day" type="date"></label>
          <label class="range-field">Até <input id="day-to" type="date"></label>
          <button id="day-next" type="button" class="step-button" aria-label="Próximo período">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg>
          </button>
          <button id="day-today" type="button" class="secondary today-button">Hoje</button>
        </span>
        <span id="day-summary" class="muted" aria-live="polite"></span>
      </div>
      <div id="day-view" class="day-view">
        <ol id="timeline" class="timeline" aria-label="Linha do tempo do dia" hidden></ol>
        <div class="map-wrap">
        <div id="map" class="map"></div>
        <div id="map-notice" class="map-notice" role="status" hidden>
          <strong id="map-notice-title"></strong>
          <p id="map-notice-text"></p>
          <button id="map-notice-action" type="button" class="secondary" hidden></button>
        </div>
        </div>
      </div>
    </main>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
  <script src="config.js?v=c164814"></script>
  <script src="stops.js?v=c164814"></script>
  <script src="app.js?v=c164814"></script>
</body>
</html>
